version: "3.9"

services:
  mcp-backend:
    build: .
    container_name: mcp-backend
    restart: unless-stopped

    ports:
      - "8099:8099"

    env_file:
      - .env

    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}

    volumes:
      - ./logs:/app/logs