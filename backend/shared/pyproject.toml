[project]
name = "vora-shared"
version = "0.2.0"
description = "Shared utilities for VORA FastAPI microservices (Postgres)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "PyJWT>=2.9.0",
  "bcrypt>=4.1.0",
  "httpx>=0.27.0",
  "python-multipart>=0.0.12",
  "email-validator>=2.2.0",
  "aiosmtplib>=3.0.0",
  "alembic>=1.13.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vora_shared*"]
